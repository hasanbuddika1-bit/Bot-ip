<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>IP Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(120% 90% at 50% 0,#13233f 0%,#0b1220 55%,#070c16 100%);
color:#eaf0ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
border-radius:26px;padding:30px 22px;text-align:center;backdrop-filter:blur(14px);
box-shadow:0 24px 60px rgba(0,0,0,.5)}
.brand{font-size:12px;letter-spacing:2.5px;color:#7f8db0;text-transform:uppercase;margin-bottom:22px}
.ring{width:118px;height:118px;margin:0 auto 24px;border-radius:50%;position:relative;
display:flex;align-items:center;justify-content:center;font-size:46px}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;
border:3px solid rgba(255,255,255,.09)}
.ring::after{content:"";position:absolute;inset:0;border-radius:50%;
border:3px solid transparent;border-top-color:#3b82f6;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ok .ring::after{border-top-color:#22c55e;animation:none;border-color:#22c55e}
.warn .ring::after{border-top-color:#f59e0b;animation:none;border-color:#f59e0b}
.bad .ring::after{border-top-color:#ef4444;animation:none;border-color:#ef4444}
h1{font-size:21px;margin-bottom:10px;font-weight:700}
p{font-size:14.5px;line-height:1.65;color:#a9b6d3;margin-bottom:20px}
.ip{display:inline-block;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.09);
border-radius:12px;padding:9px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;
color:#dbe6ff;margin-bottom:20px;word-break:break-all;max-width:100%}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-bottom:12px}
.fill{height:100%;width:6%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1);
background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
.ok .fill{background:linear-gradient(90deg,#16a34a,#22c55e)}
.warn .fill,.bad .fill{background:linear-gradient(90deg,#d97706,#ef4444)}
.step{font-size:12.5px;color:#7f8db0;min-height:18px;margin-bottom:22px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:16px;font-size:15.5px;
font-weight:700;color:#fff;background:linear-gradient(90deg,#2563eb,#4f46e5);cursor:pointer}
.btn.g{background:linear-gradient(90deg,#16a34a,#15803d)}
.btn.o{background:linear-gradient(90deg,#d97706,#b45309)}
.foot{margin-top:16px;font-size:11.5px;color:#5f6c8d;line-height:1.6}
.hide{display:none}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brand">BNB Earning Hub</div>
  <div class="ring" id="ring">🛡️</div>
  <h1 id="title">Verifying your IP</h1>
  <p id="msg">Hold on — reading this device's real network address.</p>
  <div class="ip hide" id="ip"></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="step" id="step">Starting…</div>
  <button class="btn" id="act">⏳ Please wait</button>
  <div class="foot">One IP address = one account.<br>Do not close this page.</div>
</div>
<script>
var tg = (window.Telegram && Telegram.WebApp) ? Telegram.WebApp : null;
if (tg){ try{ tg.ready(); tg.expand(); tg.setHeaderColor('#0b1220'); tg.setBackgroundColor('#0b1220'); }catch(e){} }

var hook = (new URLSearchParams(location.search)).get('hook') || '';
var E = function(id){ return document.getElementById(id); };
function buzz(t){ if(tg && tg.HapticFeedback){ try{ tg.HapticFeedback.notificationOccurred(t); }catch(e){} } }
function prog(p, s){ E('fill').style.width = p + '%'; if(s) E('step').textContent = s; }

function paint(state, icon, title, msg, btnText, btnClass){
  E('card').className = 'card ' + state;
  E('ring').textContent = icon;
  E('title').textContent = title;
  E('msg').innerHTML = msg;
  var b = E('act'); b.textContent = btnText; b.className = 'btn ' + btnClass;
}

function show(d){
  var ip = d.ip ? '<div class="ip">' + d.ip + '</div>' : '';
  if (d.ip){ E('ip').textContent = d.ip; E('ip').classList.remove('hide'); }
  prog(100, 'Finished');
  var s = d.state || '';

  if (s === 'success' || s === 'already'){
    paint('ok','✅','Verification complete',
      'Your IP is verified and this account is unlocked.<br>Go back to the bot — it is done by itself.',
      '✅ RETURN TO THE BOT','g');
    buzz('success');
    if (tg){ try{ tg.close(); }catch(e){} }
    return;
  }
  if (s === 'taken' || s === 'suspended'){
    paint('bad','⚠️','IP already used',
      'This IP address is already linked to another account.<br>The bot has been notified.',
      '❌ CONTACT THE ADMIN','o');
    buzz('error'); return;
  }
  if (s === 'local_ip'){
    paint('warn','📶','Private network',
      'A local address was detected. Turn off Wi-Fi, use mobile data and try again.',
      '🔁 TRY AGAIN','o');
    E('act').onclick = function(){ location.reload(); }; buzz('warning'); return;
  }
  paint('warn','❔','Not detected',
    (d.message || 'The server could not read this device address.'),
    '🔁 TRY AGAIN','o');
  E('act').onclick = function(){ location.reload(); }; buzz('error');
}

function optimistic(){
  prog(100,'Finished');
  paint('ok','✅','IP captured',
    'Your address was read and sent to the bot.<br>Verification is now complete.',
    '✅ RETURN TO THE BOT','g');
  buzz('success');
}

function fail(t){
  prog(100,'Stopped');
  paint('bad','⚠️','Cannot run', t, '🔁 TRY AGAIN','o');
  E('act').onclick = function(){ location.reload(); };
}

async function run(){
  if (!hook){ fail('This page was not opened from the bot. Open <b>Verify my IP</b> inside the bot.'); return; }
  prog(22,'Reading network…');
  try{
    var r = await fetch(hook, {method:'GET', cache:'no-store'});
    prog(66,'Checking this IP…');
    var txt = await r.text();
    var d = null; try{ d = JSON.parse(txt); }catch(e){ d = null; }
    if (d && d.state){ show(d); return; }
    optimistic();
  }catch(e){
    prog(55,'Sending request…');
    try{ var f = document.createElement('iframe'); f.style.display='none'; f.src = hook; document.body.appendChild(f); }catch(e2){}
    setTimeout(function(){ prog(88,'Confirming…'); setTimeout(optimistic, 1200); }, 1200);
  }
}
prog(8,'Starting…');
run();
</script>
</body>
  </html>
